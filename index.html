<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวของฉัน · ปภสิฏฐ์ สุภาผล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#3b5bdb;
    --accent-2:#5c7cfa;
    --ink:#1c1d21;
    --muted:#5b6472;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Sarabun',system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:28px;
    background:
      radial-gradient(1200px 600px at 15% 0%, #4263eb 0%, transparent 55%),
      radial-gradient(1000px 700px at 100% 100%, #748ffc 0%, transparent 50%),
      linear-gradient(135deg, #3b5bdb 0%, #1c349e 100%);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* floating soft blobs */
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;filter:blur(8px);opacity:.35;z-index:0;
  }
  body::before{
    width:340px;height:340px;top:-90px;right:-60px;
    background:radial-gradient(circle, #91a7ff, transparent 70%);
    animation:float1 9s ease-in-out infinite;
  }
  body::after{
    width:280px;height:280px;bottom:-80px;left:-50px;
    background:radial-gradient(circle, #bac8ff, transparent 70%);
    animation:float2 11s ease-in-out infinite;
  }
  @keyframes float1{50%{transform:translateY(26px)}}
  @keyframes float2{50%{transform:translateY(-26px)}}

  .card{
    position:relative;z-index:1;
    width:100%;max-width:560px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.7);
    border-radius:28px;
    padding:54px 44px 46px;
    text-align:center;
    box-shadow:0 40px 90px -30px rgba(15,30,90,.55);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px)}}
  @media(max-width:520px){.card{padding:44px 26px 38px;border-radius:22px}}

  .avatar{
    width:118px;height:118px;border-radius:50%;object-fit:cover;
    margin:0 auto 8px;display:block;
    border:4px solid #fff;
    box-shadow:0 14px 34px -12px rgba(28,49,130,.5);
  }
  .pill{
    display:inline-block;margin-bottom:18px;
    font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);background:#eef1fd;border-radius:30px;padding:5px 16px;
  }
  h1{
    font-size:1.95rem;font-weight:700;line-height:1.25;margin-bottom:16px;
  }
  @media(max-width:520px){h1{font-size:1.55rem}}
  .hello{font-size:1.12rem;margin-bottom:10px}
  .hello b{color:var(--accent)}
  .desc{color:var(--muted);font-size:1rem;margin-bottom:6px}
  .note{color:var(--muted);font-size:.96rem;margin-bottom:30px}
  .note .em{color:var(--accent);font-weight:600}

  .btn{
    display:inline-flex;align-items:center;gap:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;font-size:1.02rem;font-weight:600;
    padding:14px 30px;border-radius:40px;
    box-shadow:0 16px 34px -12px rgba(59,91,219,.7);
    transition:transform .2s, box-shadow .2s;
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 22px 42px -12px rgba(59,91,219,.85)}
  .btn .arrow{transition:transform .2s}
  .btn:hover .arrow{transform:translateX(4px)}

  .divider{height:1px;background:#edeef3;margin:30px 0 18px}
  .foot{color:#9aa1ad;font-size:.85rem;letter-spacing:.02em}
</style>
</head>
<body>

  <main class="card">
    <img class="avatar" src="profile/profile.jpg" alt="ปภสิฏฐ์ สุภาผล">
    <span class="pill">My Profile</span>
    <h1>ยินดีต้อนรับสู่<br>โปรไฟล์ของฉัน</h1>
    <p class="hello">สวัสดีครับ! ผมชื่อ <b>ปภสิฏฐ์ (Papasit)</b></p>
    <p class="desc">นักเรียนชั้นมัธยมศึกษาปีที่ 6/6 · เลขที่ 14</p>
    <p class="desc">สนใจด้าน Computer Science &amp; Engineering</p>
    <p class="note">นี่คือเว็บไซต์แรกของผมที่โฮสต์บน <span class="em">GitHub Pages</span> 🎉</p>

    <a class="btn" href="portfolio.html">
      ดูแฟ้มสะสมงานของผม <span class="arrow">→</span>
    </a>

    <div class="divider"></div>
    <p class="foot">© 2026 ปภสิฏฐ์ สุภาผล — คติประจำใจ “ ช่างมัน ”</p>
  </main>

</body>
</html>
